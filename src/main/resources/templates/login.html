<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Login - Secure Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; align-items: center; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="display-6 mb-2">🏦</div>
                        <h3 class="fw-bold text-primary mb-1">Banking Portal</h3>
                        <p class="text-muted small">Design Patterns Web Application (MVC)</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg fs-6" placeholder="e.g. cust1" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-muted">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg fs-6" placeholder="pass" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm fw-semibold">
                            Secure Login (Proxy Gateway)
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <small class="text-muted d-block mb-2 fw-semibold">Quick Test Accounts (Password: <code>pass</code>):</small>
                        <span class="badge bg-light text-dark border me-1">Customer: <code>cust1</code></span>
                        <span class="badge bg-light text-dark border">Manager: <code>emp1</code></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
